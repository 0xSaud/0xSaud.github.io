<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page not found | Saud Alanazi</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111010" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
<script>
    (function () {
        var el = document.documentElement;
        try {
            var stored = localStorage.getItem('theme');
            var light = stored ? stored === 'light'
                : window.matchMedia('(prefers-color-scheme: light)').matches;
            if (light) el.setAttribute('data-theme', 'light');
        } catch (err) { /* storage unavailable — fall back to dark */ }
    })();
</script>
</head>
<body>
<main class="hero page-center">
    <div class="wrap">
        <p class="kicker">Error 404</p>
        <h1 class="hero-title">Page not found</h1>
        <p class="hero-desc">
            That link points to something that isn't here. It may have moved, or never existed.
        </p>
        <div class="hero-cta">
            <a class="btn btn-primary" href="/">Back to home</a>
            <a class="btn btn-ghost" href="/ar.html" lang="ar">العربية</a>
        </div>
    </div>
</main>
</body>
</html>
